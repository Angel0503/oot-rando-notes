<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OoT Rando Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <datalist id="item-list"></datalist>

    <main id="layout">

        <section>
            <h2>Path (5)</h2>
            <div id="path-container"></div>
        </section>

        <section>
            <h2>Barren (2)</h2>
            <div class="barren-container">
                <textarea class="hint-input" rows="1" placeholder="Barren area 1..."></textarea>
                <textarea class="hint-input" rows="1" placeholder="Barren area 2..."></textarea>
            </div>
        </section>

        <div class="two-col">
            <section>
                <h2>Always</h2>
                <div id="always-container"></div>
            </section>
            <section>
                <h2>Arrows &amp; Skulls</h2>
                <div id="special-container"></div>
            </section>
        </div>

        <section>
            <h2>Important Checks (2)</h2>
            <div id="important-container"></div>
        </section>

        <section>
            <h2>Sometimes (4)</h2>
            <div id="sometimes-container"></div>
        </section>

        <section>
            <h2>Dual (2)</h2>
            <div id="dual-container"></div>
        </section>

        <section>
            <h2>Other Notes</h2>
            <div id="notes-container"></div>
        </section>


    </main>

    <script src="script.js"></script>
</body>
</html>
